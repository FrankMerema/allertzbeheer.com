<main id="main-content">
  <app-page-hero
    [eyebrow]="'home.hero.eyebrow' | t"
    [titlePrefix]="'home.hero.titlePrefix' | t"
    [titleHighlight]="'home.hero.titleHighlight' | t"
    [titleSuffix]="'home.hero.titleSuffix' | t"
    [description]="'home.hero.description' | t"
    [primaryLabel]="'home.hero.primaryLabel' | t"
    primaryRoute="/diensten"
    [secondaryLabel]="'home.hero.secondaryLabel' | t"
    secondaryRoute="/expertise"
  ></app-page-hero>

  <section class="bg-surface-container-low/70 py-16 md:py-24">
    <div class="mx-auto max-w-[1200px] px-5 sm:px-6 md:px-8">
      <app-section-heading
        [title]="'home.section.title' | t"
        [description]="'home.section.description' | t"
      ></app-section-heading>

      <div class="grid grid-cols-1 gap-6 md:grid-cols-3 md:gap-8">
        @for (card of featureCards; track card.titleKey) {
          <app-feature-card
            [icon]="card.icon"
            [title]="card.titleKey | t"
            [description]="card.descriptionKey | t"
            [route]="card.route"
          ></app-feature-card>
        }
      </div>
    </div>
  </section>

  <section class="py-16 md:py-24">
    <div class="mx-auto max-w-[1200px] px-5 sm:px-6 md:px-8">
      <div class="grid grid-cols-1 gap-6 md:grid-cols-2 md:gap-8">
        <div
          class="flex flex-col justify-between rounded-[1.6rem] bg-[linear-gradient(160deg,#1d252d,#313b45)] p-8 text-inverse-on-surface shadow-[0_28px_70px_-34px_rgba(24,28,32,0.55)] sm:p-10 md:p-12"
        >
          <div>
            <h2 class="text-balance mb-6 font-headline-lg text-headline-lg">
              {{ 'home.about.title' | t }}
            </h2>
            <p class="text-pretty mb-8 font-body-lg text-body-lg opacity-90">
              {{ 'home.about.description' | t }}
            </p>
          </div>
          <a
            routerLink="/expertise"
            class="focus-ring inline-flex w-fit items-center justify-center rounded-xl bg-primary px-8 py-3 font-label-sm text-on-primary transition-[background-color,filter,transform] duration-200 hover:-translate-y-0.5 hover:bg-primary-container"
          >
            {{ 'home.about.cta' | t }}
          </a>
        </div>

        <div class="grid grid-cols-2 gap-4 sm:gap-5 md:gap-8">
          <app-stat-card value="25+" [label]="'home.stats.experience' | t"></app-stat-card>
          <app-stat-card value="150+" [label]="'home.stats.projects' | t"></app-stat-card>
          <div
            class="relative col-span-2 overflow-hidden rounded-[1.5rem] bg-[linear-gradient(135deg,#dff0ff,#cce5ff)] p-6 shadow-[0_24px_60px_-36px_rgba(0,97,147,0.3)] sm:p-8"
          >
            <div class="relative z-10">
              <h3 class="mb-2 font-headline-md text-on-primary-fixed">
                {{ 'home.contactCard.title' | t }}
              </h3>
              <p class="mb-4 font-body-md text-on-primary-fixed-variant">
                {{ 'home.contactCard.description' | t }}
              </p>
              <a
                routerLink="/contact"
                class="focus-ring inline-flex items-center gap-2 rounded-sm font-label-sm text-primary transition-colors hover:text-primary-container"
              >
                {{ 'home.contactCard.cta' | t }}
                <span aria-hidden="true" class="material-symbols-outlined text-2xl">mail</span>
              </a>
            </div>
            <div aria-hidden="true" class="absolute -bottom-4 -right-4 opacity-10">
              <span class="material-symbols-outlined text-[160px]">contact_support</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>
